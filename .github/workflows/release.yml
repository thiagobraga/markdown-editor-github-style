name: Release

# Runs on version tags, e.g. `git tag v0.1.1 && git push origin v0.1.1`; the tag
# must match the `version` field in package.json. The GitHub release with the
# .vsix is always created; publishing to the VS Code Marketplace and Open VSX
# only happens when the VSCE_PAT / OVSX_PAT secrets are configured. Publish an
# existing tag later with `gh workflow run release.yml --ref v0.1.1`.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    # `main` is expected to be green in CI before tagging.
    env:
      # Job-level env makes the secrets available to the steps' `if:` checks;
      # an unset secret is just an empty string and skips that publish step.
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the tag matches the package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the package.json version ${version}."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Package VSIX
        run: npm run package -- -o "markdown-editor-github-style-${GITHUB_REF_NAME}.vsix"

      - name: Note the skipped marketplace publishing
        if: env.VSCE_PAT == '' || env.OVSX_PAT == ''
        run: |
          echo "::notice::VSCE_PAT and/or OVSX_PAT are not configured - skipping marketplace publishing. Re-run this workflow on the tag after adding the secrets to publish it."

      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx vsce publish --packagePath "markdown-editor-github-style-${GITHUB_REF_NAME}.vsix"

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx ovsx publish "markdown-editor-github-style-${GITHUB_REF_NAME}.vsix"

      - name: Create the GitHub release with the VSIX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 ||
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag
          gh release upload "${GITHUB_REF_NAME}" "markdown-editor-github-style-${GITHUB_REF_NAME}.vsix" --clobber
