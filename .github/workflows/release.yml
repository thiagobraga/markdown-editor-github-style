name: Release

# Publishing runs on version tags, e.g. `git tag v0.2.0 && git push origin v0.2.0`.
# The tag must match the `version` field in package.json.
on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    # `main` is expected to be green in CI before tagging.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the tag matches the package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the package.json version ${version}."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Package VSIX
        run: npm run package -- -o "markdown-editor-github-style-${GITHUB_REF_NAME}.vsix"

      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath "markdown-editor-github-style-${GITHUB_REF_NAME}.vsix"

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish "markdown-editor-github-style-${GITHUB_REF_NAME}.vsix"

      - name: Create the GitHub release with the VSIX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 ||
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag
          gh release upload "${GITHUB_REF_NAME}" "markdown-editor-github-style-${GITHUB_REF_NAME}.vsix" --clobber
